name: Documentation
on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "zensical.toml"
      - "postprocess.py"
      - ".github/workflows/docs.yml"
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "zensical.toml"
      - "postprocess.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install zensical mkdocs-ultralytics-plugin
      - run: zensical build --clean
      - run: python postprocess.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Wait for Pages artifact
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            if gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .id' | grep -q '[0-9]'; then
              exit 0
            fi
            sleep 5
          done
          echo "github-pages artifact was not visible in the Actions API" >&2
          exit 1
      - uses: actions/deploy-pages@v5
        id: deployment
        if: github.event_name != 'pull_request'
